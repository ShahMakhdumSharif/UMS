spring.application.name=university-management-system-test

# H2 in-memory database configuration for tests
spring.datasource.url=jdbc:h2:mem:university_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Secret & Expiration
app.jwt.secret=9a3f2b4e8c1d5e7f0a2b4c6d8e0f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d3e5f
app.jwt.expiration-ms=86400000

